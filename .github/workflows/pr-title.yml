name: PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Any description of 3+ characters is accepted (names like RFID, PACE are fine).
          subjectPattern: ^.{3,}$
          subjectPatternError: |
            The PR title "{title}" needs a short description after the type, e.g.
            "fix(fees): correct due date on receipts" or "feat(rfid): add swipe report".
